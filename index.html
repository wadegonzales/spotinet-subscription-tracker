<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Plan Tracker</title>
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
:root{--bg:#0b0b0b;--bg2:#121212;--card:#181818;--card2:#222;--text:#f4f4f4;--mute:#9a9a9a;--line:#2a2a2a;--ac:#1ed760;--ac-ink:#04130a;--glow:rgba(30,215,96,.28);--r:18px;--rb:999px;--hf:"Plus Jakarta Sans",system-ui,sans-serif;--ht:none;--hs:26px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-plan="netflix"]{--bg:#000;--bg2:#0a0a0a;--card:#141414;--card2:#1f1f1f;--ac:#e50914;--ac-ink:#fff;--glow:rgba(229,9,20,.32);--r:6px;--rb:4px;--hf:"Bebas Neue",Impact,sans-serif;--ht:uppercase;--hs:34px;--line:#262626}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(120% 60% at 50% -10%,var(--glow),transparent 60%),var(--bg);color:var(--text);font:15px/1.4 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;transition:background .4s}
main{max-width:560px;margin:0 auto;padding:16px 16px 60px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:active{transform:scale(.97)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg2);border:1px solid var(--line);padding:5px;border-radius:var(--r);margin-bottom:18px}
.tab{padding:11px 8px;border-radius:calc(var(--r) - 4px);font-weight:700;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:8px}
.tab i{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.5}
.tab.on{color:#fff}
.tab[data-p="spotify"].on{background:#1ed760;color:#04130a;border-radius:999px}
.tab[data-p="netflix"].on{background:#e50914;color:#fff;border-radius:4px}
.tab[data-p="spotify"].on i,.tab[data-p="netflix"].on i{opacity:1;background:currentColor}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.title{font-family:var(--hf);text-transform:var(--ht);font-size:var(--hs);font-weight:800;line-height:1;letter-spacing:.01em}
.title small{display:block;font-family:"Plus Jakarta Sans",sans-serif;text-transform:none;font-size:12px;font-weight:500;color:var(--mute);letter-spacing:0;margin-top:6px}
.mon{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--rb);padding:3px}
.mon button{width:30px;height:30px;border-radius:var(--rb);color:var(--mute);font-size:18px}
.mon span{font-size:13px;font-weight:700;min-width:84px;text-align:center}
.hero{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,var(--glow),transparent 70%),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.ring{--pct:0;width:92px;height:92px;border-radius:50%;flex:none;background:conic-gradient(var(--ac) calc(var(--pct)*1%),var(--card2) 0);display:grid;place-items:center;transition:--pct .7s cubic-bezier(.2,.8,.2,1)}
.ring div{width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--hf);font-size:24px;font-weight:800}
.hero .big{font-family:var(--hf);text-transform:var(--ht);font-size:30px;font-weight:800;line-height:1}
.hero .lbl{color:var(--mute);font-size:12px;margin-top:6px}
.hero .left{margin-top:8px;font-size:13px;font-weight:700;color:var(--ac)}
.filters{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.f{padding:8px 15px;border-radius:var(--rb);background:var(--card);border:1px solid var(--line);color:var(--mute);font-size:13px;font-weight:700}
.f.on{background:var(--text);color:#000;border-color:var(--text)}
.copy{margin-left:auto;color:var(--ac);font-size:13px;font-weight:700;padding:8px 4px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:8px}
.row.paid{border-color:transparent;background:linear-gradient(90deg,var(--glow),transparent 55%),var(--card)}
.av{width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;flex:none;color:var(--ac)}
:root[data-plan="netflix"] .av{border-radius:6px}
.who{flex:1;min-width:0}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--mute)}
.row.paid .who span{color:var(--ac)}
.pay{padding:10px 16px;border-radius:var(--rb);font-weight:800;font-size:13px;background:var(--card2);color:var(--text);border:1px solid var(--line);white-space:nowrap}
.row.paid .pay{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.x{color:var(--mute);width:28px;height:28px;border-radius:50%;font-size:13px;flex:none}
.x.arm{background:#c0392b;color:#fff;width:auto;padding:0 10px;border-radius:var(--rb)}
.add{display:flex;gap:8px;margin:16px 0}
input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:var(--rb);padding:12px 16px;min-width:0;outline:none}
input:focus{border-color:var(--ac)}
.add input{flex:1}
.cta{background:var(--ac);color:var(--ac-ink);font-weight:800;padding:12px 20px;border-radius:var(--rb)}
.empty{text-align:center;color:var(--mute);padding:34px 0}
.set{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.set label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.stat{text-align:center;color:var(--mute);font-size:11px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:#000;padding:10px 16px;border-radius:var(--rb);font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1}

.set{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;color:var(--text)}
.set small{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.set b{font-family:var(--hf);text-transform:var(--ht);font-size:20px;font-weight:800}
.set em{font-style:normal;color:var(--ac);font-weight:800;font-size:13px}
.due{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:14px}
.due small{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.due b{font-family:var(--hf);text-transform:var(--ht);font-size:24px;font-weight:800;line-height:1.1}
#duepill{font-size:12px;font-weight:800;padding:7px 12px;border-radius:var(--rb);background:var(--card2);color:var(--text);white-space:nowrap}
#duepill:empty{display:none}
#duepill.ok{background:var(--ac);color:var(--ac-ink)}
#duepill.soon{background:#f5a623;color:#000}
#duepill.late{background:#c0392b;color:#fff}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.66);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fade .2s}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 20px 60px var(--glow);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:600px){.modal{align-items:center}}
.mt{font-family:var(--hf);text-transform:var(--ht);font-size:26px;font-weight:800;margin-bottom:4px}
.msub{color:var(--mute);font-size:13px;margin-bottom:16px}
.amt{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--rb);padding:0 16px}
.amt span{font-weight:800;color:var(--ac);font-size:18px}
.amt input{flex:1;border:0;background:none;font-size:22px;font-weight:800;padding:14px 0;border-radius:0}
.mbtns{display:flex;gap:10px;margin-top:16px}
.mbtns button{flex:1;padding:13px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
#intro{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;transition:opacity .35s,visibility .35s;cursor:pointer}
#intro.out{opacity:0;visibility:hidden}
.ib{display:flex;flex-direction:column;align-items:center;gap:26px}
.wm{display:flex;align-items:center;gap:16px}
.wm .s{font:800 40px/1 "Plus Jakarta Sans",system-ui,sans-serif;color:#1ed760;letter-spacing:-.02em;text-shadow:0 0 28px rgba(30,215,96,.55);animation:fromL .5s cubic-bezier(.2,.8,.2,1) both}
.wm .n{font:400 54px/1 "Bebas Neue",Impact,sans-serif;color:#e50914;letter-spacing:.06em;text-shadow:0 0 28px rgba(229,9,20,.55);animation:fromR .5s .1s cubic-bezier(.2,.8,.2,1) both}
.wm .p{color:#666;font-size:26px;animation:pop .3s .4s both}
.mk{width:120px;height:120px;animation:pop .35s .5s both}
.mk path{fill:none;stroke-width:40;stroke-linecap:round;stroke-dasharray:460;stroke-dashoffset:460;animation:draw .5s .55s forwards ease-out}
.mk .ck{stroke:#fff;stroke-width:38;stroke-linejoin:round;stroke-dasharray:200;stroke-dashoffset:200;animation:draw .3s .95s forwards ease-out}
.itag{color:#777;font-size:13px;letter-spacing:.14em;text-transform:uppercase;animation:pop .35s 1.1s both}
@keyframes fromL{from{opacity:0;transform:translateX(-70px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes fromR{from{opacity:0;transform:translateX(70px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#intro{display:none}}

.side,.panel{display:contents}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg2) 88%,transparent)}
.empty{grid-column:1/-1}
@media (hover:hover){.row:hover{border-color:var(--ac)}}
@media (min-width:1000px){
  main{max-width:none;margin:0;padding:28px clamp(28px,3vw,56px);display:grid;grid-template-columns:minmax(380px,30%) 1fr;grid-template-areas:"a b" "c b";grid-template-rows:auto 1fr;column-gap:clamp(24px,3vw,48px);min-height:100vh;align-content:start}
  .side{display:block}
  .side1{grid-area:a}
  .side2{grid-area:c;align-self:start}
  .panel{grid-area:b;align-self:start;position:sticky;top:28px;height:calc(100vh - 56px);display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:20px}
  .tabs{position:relative;backdrop-filter:none;background:var(--bg2)}
  .title{font-size:calc(var(--hs) + 8px)}
  .hero{padding:24px}
  .ring{width:120px;height:120px}
  .ring div{width:94px;height:94px;font-size:30px}
  .hero .big{font-size:38px}
  .filters{flex:none;margin-bottom:16px}
  #list{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr;gap:10px;align-content:start;padding-right:4px}
  #list .row{margin-bottom:0}
}

@property --pct{syntax:"<number>";inherits:false;initial-value:0}
@property --bg{syntax:"<color>";inherits:true;initial-value:#0b0b0b}
@property --bg2{syntax:"<color>";inherits:true;initial-value:#121212}
@property --card{syntax:"<color>";inherits:true;initial-value:#181818}
@property --card2{syntax:"<color>";inherits:true;initial-value:#222222}
@property --line{syntax:"<color>";inherits:true;initial-value:#2a2a2a}
@property --ac{syntax:"<color>";inherits:true;initial-value:#1ed760}
@property --ac-ink{syntax:"<color>";inherits:true;initial-value:#04130a}
@property --glow{syntax:"<color>";inherits:true;initial-value:rgba(30,215,96,.28)}
@property --r{syntax:"<length>";inherits:true;initial-value:18px}
@property --rb{syntax:"<length>";inherits:true;initial-value:999px}
:root{transition:--bg .5s ease,--bg2 .5s ease,--card .5s ease,--card2 .5s ease,--line .5s ease,--ac .5s ease,--ac-ink .5s ease,--glow .5s ease,--r .5s ease,--rb .5s ease}
button,.row,.f,.pay,.av,.box,#duepill,.x{transition:background-color .25s,color .25s,border-color .25s,transform .15s,opacity .2s,box-shadow .3s}
.tab{position:relative;z-index:1;transition:color .3s}
.ind{position:absolute;z-index:0;top:5px;bottom:5px;left:5px;width:calc((100% - 16px)/2);background:var(--ac);border-radius:var(--rb);box-shadow:0 6px 24px var(--glow);transition:transform .45s cubic-bezier(.2,.9,.3,1.1),background-color .45s,border-radius .45s}
:root[data-plan="netflix"] .ind{transform:translateX(calc(100% + 6px))}
.tab[data-p].on{background:none}
.tab.on{color:var(--ac-ink)}
@keyframes rowIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.row.in{animation:rowIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes swapIn{from{opacity:0;transform:translate(var(--dx,0px),var(--dy,10px))}}
.swap{animation:swapIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes popBtn{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pay.pop{animation:popBtn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes flash{from{box-shadow:0 0 0 0 var(--ac)}to{box-shadow:0 0 0 14px transparent}}
.row.just{animation:flash .7s ease-out}
@keyframes rowOut{to{opacity:0;transform:translateX(30px) scale(.97)}}
.row.leaving{animation:rowOut .28s ease-in forwards}
@keyframes fadeout{to{opacity:0}}
@keyframes down{to{transform:translateY(24px);opacity:0}}
.modal.closing{animation:fadeout .18s forwards}
.modal.closing .sheet{animation:down .18s forwards}
.toast{transform:translate(-50%,14px)}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
  <div class="side side1">
  <div class="tabs"><span class="ind"></span>
    <button class="tab" data-p="spotify"><i></i>Spotify</button>
    <button class="tab" data-p="netflix"><i></i>Netflix</button>
  </div>

  <div class="head">
    <div class="title"><span id="ptitle"></span><small id="psub"></small></div>
    <div class="mon"><button id="prev" aria-label="Previous month">‹</button><span id="mlabel"></span><button id="next" aria-label="Next month">›</button></div>
  </div>

  <div class="due">
    <div><small>Due every 20th</small><b id="duedate"></b></div>
    <span id="duepill"></span>
  </div>

  <div class="hero">
    <div class="ring" id="ring"><div id="pct">0%</div></div>
    <div>
      <div class="big" id="coll">₱0</div>
      <div class="lbl" id="cnt"></div>
      <div class="left" id="left"></div>
    </div>
  </div>

  </div>
  <div class="panel">
  <div class="filters">
    <button class="f on" data-f="all">All</button>
    <button class="f" data-f="unpaid">Unpaid</button>
    <button class="f" data-f="paid">Paid</button>
    <button class="copy" id="copy">Copy unpaid list</button>
  </div>

  <div id="list"></div>

  </div>
  <div class="side side2">
  <div class="add">
    <input id="newname" placeholder="Add a person to this plan" maxlength="40">
    <button class="cta" id="addbtn">Add</button>
  </div>

  <button class="set" id="setbtn"><span><small id="plabel"></small><b id="pshow"></b></span><em>Edit ✎</em></button>
  <div class="stat" id="status">Spotify Family · Netflix Family</div>
  </div>
</main>
<div class="toast" id="toast"></div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="mt" id="mtitle"></div>
    <div class="msub">What each person pays per month</div>
    <div class="amt"><span>₱</span><input id="price" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    <div class="mbtns"><button class="f" id="mcancel">Cancel</button><button class="cta" id="msave">Save</button></div>
  </div>
</div>

<div id="intro" aria-hidden="true">
  <div class="ib">
    <div class="wm"><span class="s">Spotify</span><span class="p">+</span><span class="n">NETFLIX</span></div>
    <svg class="mk" viewBox="0 0 512 512"><path d="M240.3 106.8 A150 150 0 0 0 240.3 405.2" stroke="#1ed760"/><path d="M271.7 106.8 A150 150 0 0 1 271.7 405.2" stroke="#e50914"/><path class="ck" d="M194 264 L240 308 L322 212"/></svg>
    <div class="itag">Family Plan Tracker</div>
  </div>
</div>

<script>
const PLANS={spotify:{n:"Spotify",sub:"Family plan · who’s paid"},netflix:{n:"Netflix",sub:"Family plan · who’s paid"}};
const LS="family-tracker-v1",LP="family-tracker-plan";
let state={members:[],prices:{spotify:0,netflix:0},paid:{}};
let plan="spotify",filter="all",month=new Date().toISOString().slice(0,7);
let dbDoc=null,armed=null,saveTimer=null;
let animateNext=true,enterId=null,justId=null;
try{const s=localStorage.getItem(LS);if(s)state=Object.assign(state,JSON.parse(s))}catch(e){}
const h=location.hash.slice(1);
try{plan=PLANS[h]?h:(PLANS[localStorage.getItem(LP)]?localStorage.getItem(LP):"spotify")}catch(e){plan=PLANS[h]?h:"spotify"}

const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const peso=n=>"₱"+Number(n||0).toLocaleString("en-PH",{maximumFractionDigits:2});
const key=m=>m+"|"+plan+"|"+month;
const inPlan=m=>m.plans?.[plan]!==false;

function replay(sel,dx,dy){document.querySelectorAll(sel).forEach(e=>{e.style.setProperty("--dx",dx+"px");e.style.setProperty("--dy",dy+"px");e.classList.remove("swap");void e.offsetWidth;e.classList.add("swap")})}
function count(el,to,fmt){
  const from=parseFloat(el.dataset.v);el.dataset.v=to;
  cancelAnimationFrame(el._r);
  if(isNaN(from)||from===to||matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=fmt(to);return}
  const t0=performance.now(),D=550;
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=fmt(k<1?Math.round(from+(to-from)*e):to);if(k<1)el._r=requestAnimationFrame(step)};
  el._r=requestAnimationFrame(step);
}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
function shift(d){const[y,m]=month.split("-").map(Number);const dt=new Date(y,m-1+d,1);month=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");animateNext=true;render();replay(".hero,.due,.mon span",d*22,0)}
function persist(){
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(!dbDoc)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{dbDoc.set(JSON.parse(JSON.stringify(state))).catch(()=>{$("status").textContent="Couldn’t sync, saved on this device only"})},400);
}
function setPlan(p){if(p===plan)return;plan=p;filter="all";armed=null;animateNext=true;try{localStorage.setItem(LP,p)}catch(e){}try{location.hash=p}catch(e){}render();replay(".hero,.due,.head .title,.set",0,10)}

function render(){
  document.documentElement.dataset.plan=plan;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.p===plan));
  document.querySelectorAll(".f").forEach(t=>t.classList.toggle("on",t.dataset.f===filter));
  $("ptitle").textContent=PLANS[plan].n;
  $("psub").textContent=PLANS[plan].sub;
  const[y,m]=month.split("-");
  $("mlabel").textContent=new Date(y,m-1,1).toLocaleString("en",{month:"short",year:"numeric"});
  $("plabel").textContent=PLANS[plan].n+" share per person";
  $("pshow").textContent=state.prices[plan]?peso(state.prices[plan])+" / month":"Tap to set";

  const all=state.members.filter(inPlan);
  const paidN=all.filter(x=>state.paid[key(x.id)]).length;
  const price=state.prices[plan]||0;
  const pct=all.length?Math.round(paidN/all.length*100):0;
  $("ring").style.setProperty("--pct",pct);
  count($("pct"),pct,v=>v+"%");
  count($("coll"),paidN*price,peso);
  $("cnt").textContent=paidN+" of "+all.length+" paid this month";
  $("left").textContent=all.length-paidN>0?peso((all.length-paidN)*price)+" still to collect":(all.length?"All paid 🎉":"");
  const dd=new Date(+y,+m-1,20),td=new Date();td.setHours(0,0,0,0);
  const diff=Math.round((dd-td)/864e5),pend=all.length-paidN,pill=$("duepill");
  $("duedate").textContent=dd.toLocaleString("en",{month:"short"})+" "+dd.getDate()+" "+dd.getFullYear();
  pill.className="";
  if(!all.length)pill.textContent="";
  else if(!pend){pill.textContent="All paid ✓";pill.className="ok"}
  else if(diff>0)pill.textContent="Due in "+diff+" day"+(diff>1?"s":"");
  else if(diff===0){pill.textContent="Due today";pill.className="soon"}
  else{pill.textContent="Overdue "+(-diff)+" day"+(diff<-1?"s":"");pill.className="late"}

  const shown=all.filter(x=>filter==="all"||(filter==="paid")===!!state.paid[key(x.id)]);
  const list=$("list");list.innerHTML="";
  const an=animateNext,ent=enterId,jus=justId;animateNext=false;enterId=null;justId=null;
  if(!shown.length){list.innerHTML='<div class="empty">'+(all.length?"Nobody here.":"No one on "+PLANS[plan].n+" yet. Add the first person below.")+"</div>";return}
  shown.forEach((mm,ix)=>{
    const isPaid=!!state.paid[key(mm.id)];
    const row=document.createElement("div");row.className="row"+(isPaid?" paid":"")+(an||ent===mm.id?" in":"")+(jus===mm.id?" just":"");row.style.setProperty("--i",Math.min(ix,12));row.dataset.id=mm.id;
    const av=document.createElement("div");av.className="av";av.textContent=(mm.name.trim()[0]||"?").toUpperCase();
    const who=document.createElement("div");who.className="who";
    const nm=document.createElement("b");nm.textContent=mm.name;
    const st=document.createElement("span");st.textContent=isPaid?"Paid":"Unpaid"+(price?" · "+peso(price):"");
    who.append(nm,st);
    const pay=document.createElement("button");pay.className="pay"+(jus===mm.id?" pop":"");pay.textContent=isPaid?"✓ Paid":"Mark paid";
    pay.onclick=()=>{if(isPaid)delete state.paid[key(mm.id)];else{state.paid[key(mm.id)]=true;justId=mm.id}persist();render()};
    const x=document.createElement("button");x.className="x"+(armed===mm.id?" arm":"");x.textContent=armed===mm.id?"Remove?":"✕";
    x.setAttribute("aria-label","Remove from "+PLANS[plan].n);
    x.onclick=()=>{
      if(armed===mm.id){
        armed=null;row.classList.add("leaving");
        setTimeout(()=>{
          mm.plans=Object.assign({spotify:true,netflix:true},mm.plans);mm.plans[plan]=false;
          if(!mm.plans.spotify&&!mm.plans.netflix)state.members=state.members.filter(z=>z.id!==mm.id);
          persist();render();
        },280);
        return;
      }else{armed=mm.id;setTimeout(()=>{if(armed===mm.id){armed=null;render()}},3000)}
      render()};
    row.append(av,who,pay,x);list.appendChild(row);
  });
}

function addMember(){
  const v=$("newname").value.trim();if(!v)return;
  const ex=state.members.find(z=>z.name.toLowerCase()===v.toLowerCase());
  if(ex){ex.plans=Object.assign({spotify:true,netflix:true},ex.plans);ex.plans[plan]=true;enterId=ex.id}
  else{const id=uid();enterId=id;state.members.push({id,name:v,plans:{spotify:plan==="spotify",netflix:plan==="netflix"}});setTimeout(()=>{const r=document.querySelector('.row[data-id="'+id+'"]');if(r)r.scrollIntoView({block:"nearest",behavior:"smooth"})},80)}
  $("newname").value="";persist();render();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setPlan(t.dataset.p));
document.querySelectorAll(".f").forEach(t=>t.onclick=()=>{filter=t.dataset.f;animateNext=true;render()});
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
$("addbtn").onclick=addMember;
$("newname").addEventListener("keydown",e=>{if(e.key==="Enter")addMember()});
function openModal(){$("mtitle").textContent=PLANS[plan].n+" · share per person";$("price").value=state.prices[plan]||"";$("modal").hidden=false;setTimeout(()=>$("price").focus(),60)}
function closeModal(){const m=$("modal");if(m.hidden)return;m.classList.add("closing");setTimeout(()=>{m.hidden=true;m.classList.remove("closing")},180)}
function saveModal(){state.prices[plan]=parseFloat($("price").value)||0;persist();closeModal();render()}
$("setbtn").onclick=openModal;$("mcancel").onclick=closeModal;$("msave").onclick=saveModal;
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
$("price").addEventListener("keydown",e=>{if(e.key==="Enter")saveModal();if(e.key==="Escape")closeModal()});
$("copy").onclick=async()=>{
  const names=state.members.filter(inPlan).filter(x=>!state.paid[key(x.id)]).map(x=>x.name);
  if(!names.length){toast("Everyone has paid");return}
  const txt=PLANS[plan].n+" "+$("mlabel").textContent+" – unpaid:\n"+names.join("\n");
  try{await navigator.clipboard.writeText(txt);toast("Copied "+names.length+" names")}catch(e){toast("Couldn’t copy on this device")}
};
window.addEventListener("hashchange",()=>{const p=location.hash.slice(1);if(PLANS[p]&&p!==plan){plan=p;filter="all";render()}});

render();
(function(){const it=$("intro");if(!it)return;const hide=()=>{if(it.classList.contains("out"))return;it.classList.add("out");animateNext=true;render();replay(".hero,.due,.head",0,12);setTimeout(()=>it.remove(),450)};it.onclick=hide;setTimeout(hide,1800)})();
(async()=>{
  try{
    const db=await claude.use("db");if(!db)return;
    dbDoc=db.doc("tracker/main");let first=true;
    dbDoc.onSnapshot(snap=>{
      if(snap.exists){state=Object.assign({members:[],prices:{spotify:0,netflix:0},paid:{}},JSON.parse(JSON.stringify(snap.data())));try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}render()}
      else if(first&&state.members.length){persist()}
      first=false;$("status").textContent="Synced across your devices";
    },()=>{$("status").textContent="Offline, saved on this device"});
  }catch(e){}
})();
</script>
</body>
</html>
